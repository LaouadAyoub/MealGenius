name: Backend CI
on:
  push:
    branches: [main, master, portfolio/public-release]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy verified artifact to configured Azure App Service
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.13
        env:
          POSTGRES_USER: mealgenius
          POSTGRES_PASSWORD: ci-ephemeral-only
          POSTGRES_DB: mealgenius_tests
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mealgenius" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      MEALGENIUS_TEST_POSTGRES: Host=localhost;Port=5432;Database=mealgenius_tests;Username=mealgenius;Password=ci-ephemeral-only
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/scan-secrets.cjs --history HEAD
      - run: dotnet tool restore
      - run: dotnet restore MealGeniusBackend.sln
      - run: dotnet build MealGeniusBackend.sln -c Release --no-restore
      - run: dotnet test MealGeniusBackend.sln -c Release --no-build --logger trx
      - run: dotnet publish MealGeniusBackend.csproj -c Release --no-build -o artifacts/publish
      - uses: actions/upload-artifact@v4
        with:
          name: backend
          path: artifacts/publish
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: backend
          path: publish
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish
