    image: meal-genius-backend
    container_name: new-meal-genius
    ports:
      - 8080:5139
    environment:
      - MEALGENIUS_CONNECTIONSTRING=Host=localhost;Port=5432;Database=GeniusDb;Username=root;Password=REDACTED
      - OPENAI_API_KEY= my-secret-key
      - FRONTEND_URL= http://localhost:3000